<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMD Garden Crawl — Ledger letter (dark + light drafts)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" />
  <style>
    /*
      Letter drafts scaled from the Cursor canvas schematic (400px = 8.5in).
      --u is one schematic pixel. Tweak type/spacing with calc(N * var(--u)).
      Theme tokens match src/components/BaseHead.astro / docs/design-system.md.
    */
    :root {
      --u: calc(8.5in / 400);
      --preview: 0.82;
      --font-sans: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --workspace: #6b6458;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--workspace);
      color: #f4efe4;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-underline-offset: 0.12em; }
    a:hover { color: var(--text); }

    .chrome {
      max-width: 17.5in;
      margin: 0 auto;
      padding: 20px 24px 8px;
    }
    .chrome h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .chrome p {
      margin: 0 0 14px;
      color: #ddd4c4;
      font-size: 0.88rem;
      line-height: 1.45;
      max-width: 72ch;
    }
    .chrome kbd {
      font-family: var(--font-mono);
      font-size: 0.75em;
      padding: 0.1em 0.35em;
      border: 1px solid rgba(244, 239, 228, 0.28);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
    }
    .actions button,
    .actions label {
      appearance: none;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 8px 12px;
      border: 1px solid rgba(244, 239, 228, 0.28);
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .actions button:hover { background: rgba(244, 239, 228, 0.08); }
    .actions label { display: inline-flex; align-items: center; gap: 8px; cursor: default; }
    .actions input[type="range"] { width: 120px; }

    .board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px 36px;
      padding: 8px 24px 48px;
    }
    .frame { display: flex; flex-direction: column; gap: 8px; }
    .frame figcaption {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ddd4c4;
    }

    .sheet {
      position: relative;
      width: 8.5in;
      height: 11in;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      border: 1px solid #1a1a1a;
      font-family: var(--font-sans);
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    @media screen {
      .sheet { zoom: var(--preview); }
    }

    .sheet[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b1015;
      --surface: #0e151b;
      --border: #1c2a33;
      --border-2: #24333d;
      --rule: #1a262e;
      --text: #e4ecf0;
      --text-2: #a8bcc6;
      --text-3: #93a7b1;
      --text-4: #5f7b88;
      --accent: #7ed4e2;
      --accent-solid: #1f7a8c;
      --ok: #6fc79b;
      --ok-soft: rgba(79, 158, 119, 0.14);
    }
    .sheet[data-theme="light"] {
      color-scheme: light;
      --bg: #f6f3ec;
      --surface: #ece7db;
      --border: #ccc3ae;
      --border-2: #cfc5ae;
      --rule: #e0d9c8;
      --text: #14100b;
      --text-2: #3c362b;
      --text-3: #5c5445;
      --text-4: #8a8272;
      --accent: #1a6a79;
      --accent-solid: #1f7a8c;
      --ok: #2f6b4d;
      --ok-soft: rgba(63, 122, 92, 0.12);
    }

    .sprockets {
      position: absolute;
      left: 0;
      top: calc(18 * var(--u));
      display: flex;
      flex-direction: column;
      gap: calc(21 * var(--u));
    }
    .sprockets span {
      width: calc(7 * var(--u));
      height: calc(11 * var(--u));
      background: var(--surface);
      border: 1px solid var(--rule);
      border-left: 0;
    }

    .inset {
      position: absolute;
      inset: calc(10 * var(--u));
      border: 1px solid var(--rule);
      pointer-events: none;
    }

    .inner {
      position: relative;
      height: 100%;
      padding: calc(22 * var(--u)) calc(22 * var(--u)) calc(20 * var(--u)) calc(28 * var(--u));
      display: flex;
      flex-direction: column;
      gap: calc(12 * var(--u));
    }

    .masthead { flex-shrink: 0; }

    .kicker {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: calc(12 * var(--u));
      font-family: var(--font-mono);
      font-size: calc(9 * var(--u));
      color: var(--text-4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: calc(8 * var(--u));
      white-space: nowrap;
    }
    .kicker .audience { letter-spacing: 0.04em; text-transform: none; }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: calc(16 * var(--u));
      margin-bottom: calc(10 * var(--u));
    }
    .claim {
      margin: 0;
      font-size: calc(24 * var(--u));
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.012em;
      flex: 1 1 auto;
      min-width: 0;
    }
    .claim em {
      font-style: normal;
      color: var(--accent);
    }
    .when {
      flex: 0 0 calc(132 * var(--u));
      text-align: right;
      padding-top: calc(2 * var(--u));
    }
    .when .invite {
      font-size: calc(10 * var(--u));
      color: var(--text-2);
      line-height: 1.3;
      margin: 0 0 calc(5 * var(--u));
    }
    .when .dates {
      margin: 0;
      font-size: calc(13 * var(--u));
      font-weight: 600;
      line-height: 1.2;
    }
    .dek {
      margin: 0;
      font-size: calc(12 * var(--u));
      line-height: 1.45;
      color: var(--text-2);
      max-width: calc(340 * var(--u));
    }

    .specimen {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: visible;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .spec {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      z-index: 1;
      height: 100%;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: calc(8 * var(--u));
      flex: 1 1 0;
      min-height: 0;
      padding: 0 calc(10 * var(--u));
      border-bottom: 1px solid var(--rule);
      font-family: var(--font-mono);
      font-size: calc(8 * var(--u));
      line-height: 1.35;
    }
    .row dt {
      margin: 0;
      color: var(--text-4);
      flex-shrink: 0;
      font-weight: 400;
    }
    .row dd {
      margin: 0;
      color: var(--text);
      text-align: right;
      overflow-wrap: anywhere;
    }
    .row dd.hi { color: var(--accent); }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(8 * var(--u));
      flex: 1 1 0;
      min-height: 0;
      padding: 0 calc(10 * var(--u));
      font-family: var(--font-mono);
      font-size: calc(8 * var(--u));
    }
    .chip-ok {
      display: inline-flex;
      align-items: center;
      gap: calc(6 * var(--u));
      padding: calc(4 * var(--u)) calc(8 * var(--u));
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      color: var(--ok);
      background: var(--ok-soft);
      border: 1px solid color-mix(in srgb, var(--ok) 45%, var(--border-2));
    }
    .chip-dot {
      width: calc(5 * var(--u));
      height: calc(5 * var(--u));
      border-radius: 99px;
      background: var(--ok);
      flex-shrink: 0;
    }
    .proofcheck {
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }

    .photo {
      position: relative;
      width: 38%;
      flex: 0 0 38%;
      overflow: visible;
      background: var(--surface);
    }
    .photo img {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: calc(100% + 22 * var(--u));
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      max-width: none;
    }

    .colophon {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: calc(8 * var(--u));
      border-top: 1px solid var(--rule);
    }
    .capture {
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto auto;
      column-gap: calc(8 * var(--u));
      row-gap: 1px;
      align-items: center;
      padding-right: calc(12 * var(--u));
    }
    .capture img {
      grid-column: 1;
      grid-row: 1 / 4;
      align-self: center;
      width: calc(42 * var(--u));
      height: calc(42 * var(--u));
      display: block;
    }
    .capture .eyebrow {
      grid-column: 2;
      grid-row: 1;
      font-size: calc(9 * var(--u));
      color: var(--text-4);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .capture .brand {
      grid-column: 2;
      grid-row: 2;
      font-size: calc(13 * var(--u));
      font-weight: 600;
      line-height: 1.15;
    }
    .capture a {
      grid-column: 2;
      grid-row: 3;
      font-family: var(--font-mono);
      font-size: calc(10 * var(--u));
      text-decoration: none;
    }
    .more {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: calc(4 * var(--u));
      padding-left: calc(12 * var(--u));
      border-left: 1px solid var(--rule);
      min-width: 0;
    }
    .more p {
      margin: 0;
      font-size: calc(11 * var(--u));
      color: var(--text-2);
      line-height: 1.3;
    }
    .more a {
      font-family: var(--font-mono);
      font-size: calc(10 * var(--u));
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    @page { size: letter portrait; margin: 0; }
    @media print {
      body { background: white; }
      .chrome, .frame figcaption { display: none !important; }
      .board { display: block; padding: 0; gap: 0; }
      .frame { display: block; }
      .sheet {
        zoom: 1;
        border: 0;
        page-break-after: always;
        break-after: page;
      }
      .sheet:last-child { page-break-after: auto; break-after: auto; }
      body[data-print="dark"] .sheet[data-theme="light"],
      body[data-print="light"] .sheet[data-theme="dark"] { display: none; }
    }
  </style>
</head>
<body>
  <header class="chrome">
    <h1>UMD Garden Crawl — ledger letter drafts</h1>
    <p>
      Two 8.5×11 sheets from the locked canvas layout. Dark is the site default;
      light is the copier-friendly alternate. Print with <strong>Background graphics</strong>
      on, paper size <strong>Letter</strong>, margins <strong>None</strong>.
      In Chrome: <kbd>More settings → Background graphics</kbd>.
    </p>
    <div class="actions">
      <button type="button" onclick="printSheets('dark')">Print dark</button>
      <button type="button" onclick="printSheets('light')">Print light</button>
      <button type="button" onclick="printSheets('both')">Print both</button>
      <label>Preview
        <input id="preview" type="range" min="50" max="100" value="82"
          oninput="document.documentElement.style.setProperty('--preview', this.value / 100)" />
      </label>
    </div>
  </header>

  <main class="board">
    <figure class="frame">
      <figcaption>Dark · letter</figcaption>
      <!-- Dark sheet. Keep markup identical to light except data-theme. -->
      <div class="sheet" data-theme="dark">
        <div class="sprockets" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="inset" aria-hidden="true"></div>
        <div class="inner">
          <header class="masthead">
            <div class="kicker">
              <span>Campus wide event</span>
              <span class="audience">Open to the UMD Community</span>
            </div>
            <div class="hero">
              <h2 class="claim">Real Places.<br />Real Moments.<br /><em>Verified.</em></h2>
              <div class="when">
                <p class="invite">Join the UMD Garden Crawl</p>
                <p class="dates">01–31 Oct 2026</p>
              </div>
            </div>
            <p class="dek">Take part for a chance to win gift-card prizes while helping build a trusted record of UMD’s living landscape.</p>
          </header>

          <div class="specimen">
            <article class="card">
              <dl class="spec">
                <div class="row"><dt>garden</dt><dd>Weber Memorial Garden</dd></div>
                <div class="row"><dt>time</dt><dd>18 Aug 2026  ·  12:16 EDT</dd></div>
                <div class="row"><dt>coordinates</dt><dd class="hi">38.99070,  −76.94155</dd></div>
                <div class="row"><dt>wallet</dt><dd class="hi">0xbEd1…d5cE</dd></div>
                <div class="row"><dt>proofset_cid</dt><dd class="hi">bafybeigy6…u3xpla</dd></div>
                <div class="row"><dt>uid</dt><dd class="hi">0x44225f…3591e5</dd></div>
                <div class="card-foot">
                  <span class="chip-ok"><span class="chip-dot" aria-hidden="true"></span>Verified</span>
                  <a class="proofcheck" href="https://check.proofmode.org/#bafybeigy6ysecknnlqk5qkfxsv2z7mxahjqyvp3xbvinlaqosrcou3xpla">Verify on ProofCheck</a>
                </div>
              </dl>
              <div class="photo">
                <img src="weber-memorial.jpg" alt="Tiger swallowtail on lilac at Weber Memorial Garden" />
              </div>
            </article>
          </div>

          <footer class="colophon">
            <div class="capture">
              <img src="proofmode-mark.svg" alt="" width="42" height="42" />
              <span class="eyebrow">Capture with</span>
              <span class="brand">Proofmode</span>
              <a href="https://proofmode.org/">proofmode.org</a>
            </div>
            <div class="more">
              <p>Details on how to participate</p>
              <a href="https://gardencrawl.easierdata.org/">gardencrawl.easierdata.org</a>
            </div>
          </footer>
        </div>
      </div>
    </figure>

    <figure class="frame">
      <figcaption>Light · letter</figcaption>
      <div class="sheet" data-theme="light">
        <div class="sprockets" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="inset" aria-hidden="true"></div>
        <div class="inner">
          <header class="masthead">
            <div class="kicker">
              <span>Campus wide event</span>
              <span class="audience">Open to the UMD Community</span>
            </div>
            <div class="hero">
              <h2 class="claim">Real Places.<br />Real Moments.<br /><em>Verified.</em></h2>
              <div class="when">
                <p class="invite">Join the UMD Garden Crawl</p>
                <p class="dates">01–31 Oct 2026</p>
              </div>
            </div>
            <p class="dek">Take part for a chance to win gift-card prizes while helping build a trusted record of UMD’s living landscape.</p>
          </header>

          <div class="specimen">
            <article class="card">
              <dl class="spec">
                <div class="row"><dt>garden</dt><dd>Weber Memorial Garden</dd></div>
                <div class="row"><dt>time</dt><dd>18 Aug 2026  ·  12:16 EDT</dd></div>
                <div class="row"><dt>coordinates</dt><dd class="hi">38.99070,  −76.94155</dd></div>
                <div class="row"><dt>wallet</dt><dd class="hi">0xbEd1…d5cE</dd></div>
                <div class="row"><dt>proofset_cid</dt><dd class="hi">bafybeigy6…u3xpla</dd></div>
                <div class="row"><dt>uid</dt><dd class="hi">0x44225f…3591e5</dd></div>
                <div class="card-foot">
                  <span class="chip-ok"><span class="chip-dot" aria-hidden="true"></span>Verified</span>
                  <a class="proofcheck" href="https://check.proofmode.org/#bafybeigy6ysecknnlqk5qkfxsv2z7mxahjqyvp3xbvinlaqosrcou3xpla">Verify on ProofCheck</a>
                </div>
              </dl>
              <div class="photo">
                <img src="weber-memorial.jpg" alt="Tiger swallowtail on lilac at Weber Memorial Garden" />
              </div>
            </article>
          </div>

          <footer class="colophon">
            <div class="capture">
              <img src="proofmode-mark.svg" alt="" width="42" height="42" />
              <span class="eyebrow">Capture with</span>
              <span class="brand">Proofmode</span>
              <a href="https://proofmode.org/">proofmode.org</a>
            </div>
            <div class="more">
              <p>Details on how to participate</p>
              <a href="https://gardencrawl.easierdata.org/">gardencrawl.easierdata.org</a>
            </div>
          </footer>
        </div>
      </div>
    </figure>
  </main>

  <script>
    function printSheets(which) {
      document.body.dataset.print = which;
      window.print();
    }
    window.addEventListener("afterprint", () => {
      delete document.body.dataset.print;
    });
  </script>
</body>
</html>
